name: Validate and integrate remaining formalization gaps

on:
  push:
    branches: [formalize-remaining-gaps]
    paths: ['.github/workflows/formal-gaps-dev.yml']

permissions:
  contents: write

concurrency:
  group: formal-gaps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proofs:
    if: github.ref == 'refs/heads/formalize-remaining-gaps'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Apply reviewed integration edits in the isolated checkout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def edit(name, old, new):
              p = Path(name)
              text = p.read_text()
              if old in text:
                  assert text.count(old) == 1, (name, 'ambiguous replacement')
                  p.write_text(text.replace(old, new))
              else:
                  assert new in text, (name, 'unexpected source version')
          base = 'formal/common/SchreierUnified/'
          edit(base + 'TerminalCompositions.lean',
              '    have hsum2 := Nat.sub_add_cancel (show r ≤ q * (N + 1) + q - 1 - r + r by omega)\n    have hsum3 := Nat.sub_add_cancel (show r ≤ q * (N + 1) + q - 1 by omega)',
              '    have hsum2 := Nat.sub_add_cancel (show r ≤ q * (N + 1) + q - 1 by omega)')
          edit(base + 'Minimality.lean',
              '  simp [rationalWordSeries]\n\ntheorem rational_identity2',
              '''  simp [rationalWordSeries]

          private theorem polynomial_coe_ofNat (n : ℕ) [Nat.AtLeastTwo n] :
              ((ofNat(n) : Polynomial ℚ) : PowerSeries ℚ) = (ofNat(n) : PowerSeries ℚ) :=
            map_ofNat Polynomial.coeToPowerSeries.ringHom n

          theorem rational_identity2''')
          for definitions in ['rationalWordSeries, D2', 'rationalWordSeries, D3', 'rationalWordSeries, D4, N40']:
              edit(base + 'Minimality.lean',
                  '  norm_num [' + definitions + '] at h ⊢\n  exact h',
                  '  simpa [' + definitions + ', map_ofNat, polynomial_coe_ofNat] using h')
          edit(base + 'Minimality.lean',
              '    norm_num [Polynomial.smul_eq_C_mul]',
              '    simp [Polynomial.smul_eq_C_mul, map_ofNat]')
          edit(base + 'Audit.lean',
              'import SchreierUnified.Certificates\n\n-- Run',
              'import SchreierUnified.Certificates\nimport SchreierUnified.TerminalCompositions\nimport SchreierUnified.Minimality\n\n-- Run')
          audit = Path(base + 'Audit.lean')
          if '#check SchreierUnified.originalTerminalCompositionEquiv' not in audit.read_text():
              audit.write_text(audit.read_text() + '''
          #print SchreierUnified.IsTerminalComposition
          #print SchreierUnified.HasEventualRecurrence
          #check SchreierUnified.originalTerminalCompositionEquiv
          #check SchreierUnified.wordSeries_eq_familySeries
          #check SchreierUnified.wordSeries_equation
          #check SchreierUnified.seriesResidue_unique
          #check SchreierUnified.generatingFunctions2
          #check SchreierUnified.generatingFunctions3
          #check SchreierUnified.generatingFunctions4
          #check SchreierUnified.coefficient_extraction
          #check SchreierUnified.eventualRecurrence_iff_polynomial_multiplier
          #check SchreierUnified.denominator_degree_lower_bound
          #check SchreierUnified.original_minimal_orders

          #check (SchreierUnified.originalTerminalCompositionEquiv : ∀ q r N, 0 < q → r < q →
            {F // F ∈ SchreierUnified.family q r (N + 1)} ≃
              {c : List ℕ // SchreierUnified.IsTerminalComposition q
                (q * (N + 1) + q - 1 - r) c})

          #print axioms SchreierUnified.originalTerminalCompositionEquiv
          #print axioms SchreierUnified.wordSeries_eq_familySeries
          #print axioms SchreierUnified.wordSeries_equation
          #print axioms SchreierUnified.seriesResidue_unique
          #print axioms SchreierUnified.generatingFunctions2
          #print axioms SchreierUnified.generatingFunctions3
          #print axioms SchreierUnified.generatingFunctions4
          #print axioms SchreierUnified.coefficient_extraction
          #print axioms SchreierUnified.eventualRecurrence_iff_polynomial_multiplier
          #print axioms SchreierUnified.denominator_degree_lower_bound
          #print axioms SchreierUnified.original_minimal_orders
          ''')
          edit('README.md',
              '- [Certificates.lean](formal/common/SchreierUnified/Certificates.lean): uniqueness and polynomial identities.\n',
              '- [Certificates.lean](formal/common/SchreierUnified/Certificates.lean): uniqueness and polynomial identities.\n- [TerminalCompositions.lean](formal/common/SchreierUnified/TerminalCompositions.lean): the general composition equivalence, including q = 1.\n- [GeneratingFunctions.lean](formal/common/SchreierUnified/GeneratingFunctions.lean): actual counting series, uniqueness, and all nine rational identities.\n- [Minimality.lean](formal/common/SchreierUnified/Minimality.lean): coefficient extraction and exact eventual recurrence orders over the rationals.\n')
          edit('README.md',
              'Lean verifies the common encoding, the three recurrence theorems, the residue\npartition and coefficient uniqueness, the polynomial identities, and the\nspecified comparisons between constructions. The general terminal-composition\ntheorem, formal-power-series arguments, and minimal-order result are proved\nin the paper. The q = 3 composition correspondence is also formalized.',
              'Lean verifies the common encoding, the three recurrence theorems, the residue\npartition and coefficient uniqueness, the polynomial identities, and the\nspecified comparisons between constructions. It also verifies the general\nterminal-composition equivalence, the formal-power-series arguments and\ncoefficient extraction at every index, and the exact eventual recurrence\norders 3, 5, 5 over the rationals. These results use the original multiset\nfamilies, via the proved word-count equivalence; no counting bridge or\nrecurrence is assumed. The retained q = 3 composition proof remains available.')
          edit('README.md',
              'The validator compiles 41 modules in fresh snapshots, checks 193 transitive\naxiom reports, and runs the 15 default declaration linters.',
              'The validator compiles every common, case, and adapter module in fresh\nsnapshots, checks all requested transitive axiom reports, and runs the\n15 default declaration linters.')
          edit('docs/claims.md',
              '| General terminal-composition bijection (Proposition 5.1) | Article proof; `terminalComposition` defines only the map | Ordinary proof; q3 special case formalized |\n| Formal-series division/extraction and minimal orders 3,5,5 | Propositions 3.1 and 4.1, proof of Theorem 1.1, Corollary 4.2 | Ordinary proofs; no Lean formal-series derivation |',
              '| General terminal-composition bijection (Proposition 5.1) | `IsTerminalComposition`, `wordTerminalCompositionEquiv`, `originalTerminalCompositionEquiv` | Compiled for every positive q and r < q |\n| Actual formal counting series and unique residue solution | `wordSeries_eq_familySeries`, `wordSeries_equation`, `seriesResidue_unique` | Compiled over the integers |\n| All nine rational generating-function identities | `wordSeries_of_certificate`, `generatingFunctions2`, `generatingFunctions3`, `generatingFunctions4` | Compiled as formal power-series identities |\n| Coefficient extraction, including the initial indices | `recurrencePolynomial_mul_coeff_all`, `coefficient_extraction` | Compiled with negative-index guards |\n| Minimal eventual recurrence orders 3,5,5 (Corollary 4.2) | `eventualRecurrence_iff_polynomial_multiplier`, `denominator_degree_lower_bound`, `original_minimal_orders` | Compiled over the rationals, for arbitrary starting indices |')
          edit('docs/claims.md',
              'The three closed endpoints remain in separate module environments.\nThe nine common polynomial identities and coefficient uniqueness are checked\nseparately. The formal recurrence endpoints follow the retained case chains;\nthere is no Lean derivation of those endpoints by dividing the common\npolynomials as formal power series. Proposition 5.3 is proved in the article;\nthe common Lean layer proves the transformation formulas and word-map\nagreements, and q2 additionally has the six formal restricted bijections.\nGeneral terminal compositions, generating-function extraction, and eventual\nminimality are outside the formalized endpoints.',
              '''The three retained case endpoints remain in separate module environments.
          The common layer additionally constructs the actual counting series in
          `PowerSeries ℤ`, proves the residue system and its unique solution, and
          establishes all nine rational identities using denominators with constant
          coefficient one. `coefficient_extraction` proves the coefficient equation
          at every index; the retained case proofs of the explicit initial values
          and recurrences remain independent of this formal-series derivation.

          `HasEventualRecurrence` is defined directly on sequence coefficients, with
          an arbitrary starting index and current-term coefficient one. The equivalence
          with a polynomial multiplier is proved, not included in the definition.
          Explicit Bezout identities force every such multiplier to be divisible by
          the displayed denominator. `original_minimal_orders` states both attainment
          and the lower bounds 3, 5, 5 for the original families over the rationals.
          The sequences are indexed by maximum `N+1`, consistently with the paper.

          Proposition 5.3 is proved in the article; the common Lean layer proves the
          transformation formulas and word-map agreements, and q2 additionally has
          the six formal restricted bijections.''')
          edit('paper/main.tex',
              'The development also verifies the finite residue partition,\nuniqueness of its coefficient solution, the nine polynomial identities,\nand the correspondence with the three case constructions.\nThe general terminal-composition theorem and the generating-function\narguments, including minimality of the recurrence orders, are proved\nabove but are outside the formalisation. The supplementary material',
              'The development also verifies the general terminal-composition\nbijection, the finite residue partition, and the correspondence with\nthe three case constructions. The formal-power-series development\nconstructs the actual counting series, proves uniqueness of the residue\nsolution and all nine rational identities, and verifies coefficient\nextraction at every index. It also proves the exact minimal eventual\nrecurrence orders over the rationals, allowing arbitrary starting\nindices. The supplementary material')
          PY
          python scripts/update_sources.py
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: formal/common
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Restore pinned dependencies
        id: dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: formal/common/.lake/packages
          key: formal-gaps-deps-141f6b6455959bfeb0b2a6b04118031191d62683
      - name: Fetch pinned cache
        working-directory: formal/common
        run: lake exe cache get
      - name: Check common modules with normal compiler limits
        working-directory: formal/common
        shell: bash
        run: |
          mkdir -p .lake/build/lib/lean/SchreierUnified .build
          status=0
          for module in Words Certificates Multisets TerminalCompositions GeneratingFunctions Minimality Audit; do
            echo "===== $module ====="
            logfile=".build/$module.log"
            if lake env lean -DautoImplicit=false \
                -o ".lake/build/lib/lean/SchreierUnified/$module.olean" \
                "SchreierUnified/$module.lean" > "$logfile" 2>&1; then
              echo "Kernel check completed: $module"
            else
              status=1
            fi
            if grep -Eq 'warning:|error\(|error:|sorryAx' "$logfile"; then status=1; fi
            if [ "$module" != Audit ] || [ "$status" != 0 ]; then cat "$logfile"; fi
          done
          exit "$status"
      - name: Run the unmodified strict Lean and mathematics validators
        shell: bash
        run: |
          mkdir -p .build
          if ! python scripts/validate.py lean > .build/gap-lean-driver.log 2>&1; then
            cat .build/gap-lean-driver.log
            find .build -name '*.log' -print -exec tail -100 '{}' \;
            exit 1
          fi
          cat .build/gap-lean-driver.log
          python scripts/validate.py math
      - name: Commit only the verified integration on this development branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/formalize-remaining-gaps
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add formal/common/SchreierUnified/TerminalCompositions.lean \
            formal/common/SchreierUnified/Minimality.lean \
            formal/common/SchreierUnified/Audit.lean README.md docs/claims.md \
            paper/main.tex SOURCES.tsv
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate kernel-checked gap formalizations and update coverage documentation'
            gh auth setup-git
            git push origin HEAD:refs/heads/formalize-remaining-gaps
          fi
          git rev-parse HEAD
      - name: Upload proof and validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: formal-gap-validation-${{ github.sha }}
          path: |
            formal/common/.build/*.log
            .build/
            SOURCES.tsv
          include-hidden-files: true
          retention-days: 14
