name: Validate remaining formalization gaps

on:
  push:
    branches: [formalize-remaining-gaps]
    paths:
      - '.github/workflows/formal-gaps-dev.yml'
      - 'formal/common/**'

permissions:
  contents: read

concurrency:
  group: formal-gaps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: formal/common
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Restore pinned dependencies
        id: dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: formal/common/.lake/packages
          key: formal-gaps-deps-141f6b6455959bfeb0b2a6b04118031191d62683
      - name: Fetch pinned cache
        working-directory: formal/common
        run: lake exe cache get
      - name: Check all common modules with the Lean kernel
        working-directory: formal/common
        shell: bash
        run: |
          mkdir -p .lake/build/lib/lean/SchreierUnified .build
          status=0
          for module in Words Certificates Multisets TerminalCompositions GeneratingFunctions Minimality Audit; do
            echo "===== $module ====="
            logfile=".build/$module.log"
            if lake env lean -DautoImplicit=false \
                -o ".lake/build/lib/lean/SchreierUnified/$module.olean" \
                "SchreierUnified/$module.lean" > "$logfile" 2>&1; then
              echo "Kernel check completed: $module"
            else
              cat "$logfile"
              status=1
            fi
            if grep -E 'warning:|error\(|error:|sorryAx' "$logfile"; then
              cat "$logfile"
              status=1
            fi
            if [ "$module" != Audit ]; then cat "$logfile"; fi
          done
          exit "$status"
      - name: Save pinned dependencies
        if: always() && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: formal/common/.lake/packages
          key: formal-gaps-deps-141f6b6455959bfeb0b2a6b04118031191d62683
      - name: Upload kernel-check logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: formal-gap-checks-${{ github.sha }}
          path: formal/common/.build/*.log
          include-hidden-files: true
          retention-days: 14
